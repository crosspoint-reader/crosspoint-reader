[package]
name = "backend-rs"
version = "0.1.0"
edition = "2021"

# The C++ firmware's services, as Rust sees them. Everything that crosses the
# language boundary lives here: cpui depends on none of it.
[lib]
name = "backend"
crate-type = ["rlib"]

[features]
# Swaps the C entry points for host doubles, so downstream crates can test.
testing = []

[dependencies]
cpui-rs = { path = "../cpui_rs" }
