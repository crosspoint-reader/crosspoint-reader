[package]
name = "backend-rs"
description = "CrossPoint's firmware services, as Rust sees them"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The C++ firmware's services, as Rust sees them. Everything that crosses the
# language boundary lives here: xpui depends on none of it.
[lib]
name = "backend"
crate-type = ["rlib"]

[features]
# Swaps the C entry points for host doubles, so downstream crates can test.
testing = []

[dependencies]
xpui-rs = { path = "../xpui_rs" }
