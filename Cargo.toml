# Rust workspace for the CrossPoint UI framework and its screens.
#
# cpui is device-generic and must contain no CrossPoint-specific
# code; crosspoint_rs holds the CrossPoint screens built on top of it.
#
# Built by scripts/build_rust.py during the PlatformIO build — see
# docs/rust-ui-framework.md for the per-environment target triples.

[workspace]
resolver = "2"
members = ["lib/backend_rs", "lib/cpui_rs", "lib/crosspoint_rs"]

# Shared across both crates so host, RISC-V and Xtensa builds agree.
[profile.release]
panic = "abort"
opt-level = "z"  # Size over speed: flash is the scarce resource
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
