; SPDX-License-Identifier: GPL-3.0-or-later
;
; Our envs live here so platformio.ini stays upstream's file apart from one
; extra_configs entry. Each env is the stock x4pro env plus POCKET_LIBRARY,
; which compiles in src/pocketlib/ and the hooks gated on it.
;
;   pio run -e x4pro-pocketlib            (development: debug logs, waits for USB serial)
;   pio run -e x4pro-pocketlib-release    (what you flash day to day)
; X4 Pro (ESP32-S3) only. Never build or flash a C3 env for this device.

[env:x4pro-pocketlib]
extends = env:x4pro
build_flags =
  ${env:x4pro.build_flags}
  -DPOCKET_LIBRARY=1
  -UCROSSPOINT_VERSION
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro-pocketlib-dev\"

[env:x4pro-pocketlib-release]
extends = env:x4pro-gh_release
build_flags =
  ${env:x4pro-gh_release.build_flags}
  -DPOCKET_LIBRARY=1
  -UCROSSPOINT_VERSION
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-pocketlib\"
