; SPDX-License-Identifier: GPL-3.0-or-later
;
; Our envs live here so platformio.ini stays upstream's file apart from one
; extra_configs entry. Each env mirrors upstream's x4pro / x4pro-gh_release
; flags plus POCKET_LIBRARY, which compiles in src/pocketlib/ and the hooks
; gated on it. The flags are listed in full rather than inherited because
; upstream's lists already define CROSSPOINT_VERSION, and a second definition
; breaks the build. When rebasing, diff these against upstream's [env:x4pro].
;
;   pio run -e x4pro-pocketlib            (development: debug logs, waits for USB serial)
;   pio run -e x4pro-pocketlib-release    (what you flash day to day)
; X4 Pro (ESP32-S3) only. Never build or flash a C3 env for this device.

[pocketlib_x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
x4pro_flags =
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DENABLE_SERIAL_LOG
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DPOCKET_LIBRARY=1

[env:x4pro-pocketlib]
extends = pocketlib_x4pro
build_flags =
  ${base.build_flags}
  ${pocketlib_x4pro.x4pro_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-pocketlib-dev\"
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:x4pro-pocketlib-release]
extends = pocketlib_x4pro
build_flags =
  ${base.build_flags}
  ${pocketlib_x4pro.x4pro_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-pocketlib\"
  -DLOG_LEVEL=1
