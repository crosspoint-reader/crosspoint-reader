[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
name = "Witch Reader"
version = 2.40

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags =
  --enable=all
  ; cppcheck 2.20 (pioarduino 55.03.311) emits branch-limit notices at the default
  ; check level; exhaustive analysis avoids them.
  --check-level=exhaustive
  --suppress=missingIncludeSystem
  --suppress=unusedFunction
  --suppress=unmatchedSuppression
  --suppress=*:*/.pio/*
  ; The SDK is maintained separately; keep this check scoped to reader-owned code.
  --suppress=*:*/freeink-sdk/*
  ; Analyzer status output is not a source-code defect.
  --suppress=checkersReport
  ; ---------------------------------------------------------------------------
  ; Style/performance advisories, suppressed deliberately when cppcheck went
  ; 2.11 -> 2.20 with the 55.03.311 platform bump. Each one asks for a mechanical
  ; edit with no correctness content, and acting on them would mean ~74 changes
  ; across ~40 files -- API churn (functionStatic wants members made static),
  ; deleted overrides, and loop rewrites -- for no behavioural gain. Correctness
  ; checks are NOT suppressed: the bump's uninitvar, duplicateCondition,
  ; knownConditionTrueFalse, nullPointer, duplInheritedMember and rule-of-three
  ; findings were all fixed rather than silenced.
  ; Revisit as a standalone cleanup, not inside a dependency upgrade.
  --suppress=functionStatic
  --suppress=uselessOverride
  --suppress=useStlAlgorithm
  --suppress=returnByReference
  --suppress=constParameterPointer
  --suppress=constParameterReference
  --suppress=constVariablePointer
  --suppress=constVariableReference
  --suppress=unreadVariable
  --suppress=variableScope
  ; ---------------------------------------------------------------------------
  ; Framework macros cppcheck cannot see because the framework packages are
  ; skipped. Without them it gives up on a whole translation unit and still
  ; reports "No defects found": CrossPointWebServer.cpp went unchecked that way
  ; (PROGMEM page tables, and ESP_ARDUINO_VERSION_VAL in the WebSockets headers).
  -DPROGMEM=
  -DESP_ARDUINO_VERSION_VAL(major,minor,patch)=((major<<16)|(minor<<8)|(patch))
  ; ---------------------------------------------------------------------------
  --inline-suppr
check_skip_packages = yes
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DMAINTAIN_FREE_CLUSTER_COUNT=1 ; let sdFat cache cluster count data to speed up free space calculations
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# SdFat's SdFatConfig.h defaults USE_SPI_ARRAY_TRANSFER to 0 on every target but the
# RP2040 and UNO R4, so SdSpiArduinoDriver::receive() reads a sector with 512 separate
# transfer(0xFF) calls, each writing the data register and spinning for one byte. 1
# routes it through transfer(buf, count) -> transferBytes() -> spiTransferBytesNL(),
# which batches into the SPI FIFO. The receive path needs NO extra buffer (it memsets
# the caller's own buffer to 0xFF and transfers in place); only the send path pays a
# 512-byte stack temp, and we read far more than we write. Inert on the X4 Pro, whose
# SD is native SDMMC and never reaches SdFat's SPI driver.
  -DUSE_SPI_ARRAY_TRANSFER=1
# Give SdFat a second sector cache for FAT table sectors, as it already does on ARM, so
# following a cluster chain stops evicting the file/directory sector and seek-heavy reads
# stop re-reading the same FAT sector (crosspoint-reader PR #3685 measured SD-font prewarm
# 111 -> 83 ms on an X3). Costs ~512 B of static RAM on every board: the cache is an inline
# member of the one FsVolume (SDCardManager's), not a heap buffer. SdFatConfig.h only
# honours the flag once scripts/patch_sdfat.py has applied sdfat_patches/0002, and
# sdfat_patches/0003 keeps the single cache's FAT-before-directory write order.
  -DUSE_SEPARATE_FAT_CACHE=1
  -Wno-bidi-chars
  -Wno-deprecated-declarations
# Place TJpgDec's hot decode loop (huffext/bitext/block_idct/mcu_load) in IRAM to
# drop i-cache miss stalls on the single-core C3. Perf A/B knob; set 0 to revert.
  -DJD_FASTPATH_IRAM=1
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=panic_arch_fill_info,--wrap=panic_soc_fill_info,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
# Use the (patched) UZLIB Memcpy 'optimisation' for the LZ-copy path
  -DUZLIB_CONF_USE_MEMCPY=1
# wolfSSL TLS 1.3 backend (SecureNet). Client-only lean profile via scripts/patch_wolfssl.py.
# The SP (single-precision math) backend is architecture-specific and lives in the
# per-MCU sections below, NOT here.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
# How long an upload may stall, waiting for its next data, before it is dropped. Set here so the
# WebSocket library (5 s by default) sees it: the File Manager's and Calibre's uploads go over
# WebSocket. The HTTP uploads read the same value (src/network/UploadStallTolerance.h).
  -DWEBSOCKETS_TCP_TIMEOUT=10000
# FreeInkUI's component style overrides (Screen::setComponentStyle). No screen of ours sets one, but
# the SDK checks a runtime pointer, so the override and content-alignment code stayed in every list
# screen: ~3.3 KB of flash. 0 compiles them out (freeink-sdk FreeInkApp.h).
  -DFREEINK_UI_COMPONENT_STYLE=0

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_uzlib.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/patch_sdfat.py
  pre:scripts/gen_roots.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  post:scripts/register_unit_tests_target.py
  post:scripts/check_no_float.py

; Libraries
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
; Pinned to the exact release scripts/sdfat_patches/ was reviewed against
; (patch_sdfat.py refuses any other). Listed BEFORE SDCardManager on purpose:
; lib_deps install in order, so the pin is what lands in libdeps/<env>/SdFat and
; then satisfies the SDK's "^2.3.1". The other way round, a newer 2.x would take
; that slot and the pin would be detached into a second copy, SdFat@2.3.1.
  https://github.com/greiman/SdFat.git#2.3.1
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
; USB Mass Storage ("USB Drive"): hands the SD card to a host as a removable
; disk. Compiles to inert stubs unless FREEINK_CAP_USB_MSC is set for the board,
; so the C3 pays nothing for linking it here — same arrangement as
; FrontlightManager and Rtc below.
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
; PWM frontlight/backlight driver (LilyGo T5S3 BL_EN, X4 Pro warm/cool pair).
; Compiles to inert stubs unless FREEINK_CAP_FRONTLIGHT is set for the board, so
; the C3 pays nothing for linking it here.
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
; RTC driver for the PCF8563 family, used by HalClock. The DS3231 is still driven
; inline there (X3's path, device-validated), so this only carries the boards the
; inline code cannot serve. Compiles to stub bodies unless FREEINK_CAP_RTC is set
; for the board, so adding it here costs nothing on boards that do not use it.
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
; FreeInkUI: the widget toolkit behind the lists, tab bars, dialogs and the
; on-screen keyboard, plus the touch layer's gesture geometry (Rect, ScreenEdge,
; edgeSwipe, touchToLogical). The keyboard builds its layers with
; buildKeyboardLayout(), which keeps the layouts in compact form; nothing may call
; builtinKeyboardLayout() (or KeyboardEntry / qwertyKeyboard, which do), or the
; ~15 KB of expanded layout tables come back into the image.
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
; Header-only icon assets (freeink::Icon plus the Lucide SVG set and its generator).
; Only the struct in include/Icon.h is compiled; the SVGs and tools/ are build-time
; inputs to gen_icons.py, not sources. Costs nothing on a board that includes no icon.
  Icons=symlink://freeink-sdk/libs/assets/Icons
; FreeInkFont's OpenType layout readers on their own (GPOS kerning, GSUB ligatures, the legacy kern table): the
; TTF engine's kerning and ligatures (lib/EpdFont/ttf/TtfOpenType), without FreeInkFont's FreeType and stb engines.
  FreeInkOpenType=symlink://freeink-sdk/libs/font/FreeInkOpenType
  https://github.com/bblanchon/ArduinoJson.git#v7.4.2
  QRCode=symlink://lib/QRCode
  https://github.com/Links2004/arduinoWebSockets.git#1c8b8deaca30b36494a4f6ea4df23ae862b21662
  SaxParser=symlink://lib/SaxParser
  SerialTransfer=symlink://lib/SerialTransfer
  SecureNet=symlink://lib/SecureNet
  https://github.com/wolfSSL/Arduino-wolfSSL.git#5.7.2

lib_ignore =
  BLE

; ---------------------------------------------------------------------------
; Arduino-core rebuild. C3 ONLY — see the warning below.
;
; Any of custom_sdkconfig / custom_component_remove present in an env makes
; pioarduino rebuild the Arduino core from source instead of linking its
; prebuilt libraries (platform builder frameworks/arduino.py: each one sets its
; own flag_* and the rebuild follows). That rebuild omits the complete prebuilt
; TinyUSB component graph, which the USB-OTG boards need — the X4 Pro's
; USB-MSC file transfer is built on it. Upstream/develop splits these options
; out for exactly that reason and keeps its x4pro/x4c/papermono envs on plain
; `base`; this section is that split, ported.
;
; These lived in [base] until the 2026-08-31 resync, so every S3 env inherited
; the rebuild silently. Mirror upstream: C3 envs opt in here, S3 envs do not.
; ---------------------------------------------------------------------------
[firmware_tuned]
; NOTE: the option pioarduino actually reads is `custom_sdkconfig` (no second
; underscore) — see frameworks/arduino.py:551. The name below is misspelled, so
; this block is inert today and the C3 is NOT getting the heap reclamation it
; describes. Left verbatim rather than quietly corrected: fixing the name turns
; a ~32-37 KB heap change and a from-source core rebuild back on, which is a
; deliberate decision with its own device validation, not a merge cleanup.
custom_sdk_config = 
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
   ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

; ---------------------------------------------------------------------------
; Per-MCU-family flag sets.
;
; BoardConfig.h hard-#errors unless every selected -DFREEINK_DEVICE_* belongs to
; ONE MCU family (C3 / S3 / ESP32) — they differ in deep-sleep wakeup, SPI
; peripheral count, and toolchain, so they never share a binary. Keeping the
; device set in [base] therefore broke every S3 env; these sections exist so an
; env opts into exactly one family. Not envs themselves — interpolation only.
; ---------------------------------------------------------------------------

[c3]
; Xteink X3 + X4 (ESP32-C3, RISC-V). Both linked into one binary and chosen at
; runtime via setDisplayX3(); drives BoardConfig's driver/geometry/pin tables and
; sizes MAX_FRAMEBUFFER_BYTES to the larger panel.
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
; Neither X3 nor X4 has a digitiser, so the app-side touch layer is compiled out:
; the tap/row/target recorders, the gesture classifier, the three touch dispatchers
; and the twenty gesture settings rows. The SDK half is already gated by
; FREEINK_CAP_TOUCH. Asserted here rather than derived inside the headers, and only
; ever in the "no touch" direction, so a new board keeps touch until someone says
; otherwise -- see src/TouchUi.h for why, and MappedInputManager.cpp for the guard
; that stops this drifting from the board profile.
  -DCP_TOUCH_UI=0
; Optional: overclock the X4 display SPI from the in-spec 20 MHz to 40 MHz (what
; the old open-x4-sdk used). Saves ~17-20 ms/refresh on X4 plane writes but is 2x
; the SSD1677 datasheet max — validate on hardware before enabling. See
; FREEINK_X4_OVERCLOCK_SPI in freeink-sdk BoardConfig.h.
  -DFREEINK_X4_OVERCLOCK_SPI
; Optional: X4 fast-DU shortcut (CTRL2=0x1C instead of the stock 0xFC partial
; sequence). Saves ~85 ms/refresh but skips the per-refresh temperature load and
; power sequencing; upstream saw long-session ghosting/blotching on some panels.
; Enable only after validating on hardware. See FREEINK_X4_FAST_DU_SHORTCUT in
; freeink-sdk Ssd1677Driver.cpp and freeink-sdk/docs/deferred-refresh-migration.md.
;  -DFREEINK_X4_FAST_DU_SHORTCUT
; wolfSSL RISC-V assembly speedups. Emits RISC-V inline asm from sp_int.c, which
; the Xtensa assembler rejects outright — C3 only.
  -DWOLFSSL_SP_RISCV32

[s3]
; ESP32-S3 (Xtensa) boards: X4 Pro, LilyGo T5S3. The device flag itself comes
; from the env, since these boards do NOT currently share a binary.
build_flags =
  ${base.build_flags}
; Portable C SP math. The RISC-V path above cannot assemble on Xtensa; this is
; what upstream uses for all of its S3 targets.
  -DWOLFSSL_SP_SMALL

[env:default]
extends = base, firmware_tuned
build_flags =
  ${c3.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DSERIAL_TEST_API=1 ; the full serial test API (docs/serial-test-api.md); release builds keep the basic commands


[env:gh_release]
extends = base, firmware_tuned
build_flags =
  ${c3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags =
  ${c3.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned
build_flags =
  ${c3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ---------------------------------------------------------------------------
; x4-orbit: personal reading + OPDS profile (docs/x4-orbit.md). Same boards as
; the release (X4 and X3 in one binary); features it does not use are compiled
; out with the CP_FEATURE_* switches in src/BuildFeatures.h.
; ---------------------------------------------------------------------------
[orbit]
build_flags =
  -DCP_FEATURE_SCREENSHOT=0
  -DCP_FEATURE_QR_PAGE=0

[env:x4-orbit]
extends = base, firmware_tuned
build_flags =
  ${c3.build_flags}
  ${orbit.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-orbit\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

; ---------------------------------------------------------------------------
; Standalone SaxParser benchmark — flashes a minimal sketch that prints
; timing and heap results over serial then halts. No SD card required;
; fixture data is embedded in flash.
; Build & flash: pio run -e bench -t upload
; Monitor:       pio device monitor -e bench
; ---------------------------------------------------------------------------
[env:bench]
extends = base, firmware_tuned
; Named files rather than the whole directory: bench/ now holds more than one benchmark, and
; each has its own setup(), so compiling them together would give duplicate symbols.
build_src_filter = -<*> +<../bench/main.cpp> +<../bench/platform_stubs.c>
build_flags =
  ${c3.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0
lib_deps =
  SaxParser=symlink://lib/SaxParser

; Font-path microbenchmark: per-glyph lookup / measure / bitmap-fetch cost for the UI and reader
; faces, with no framebuffer and no panel so e-ink refresh cannot drown microsecond differences.
; This is the baseline any change to the glyph record or the bitmap codec has to be judged
; against -- see docs/future_work/font-flash.md.
;
; LOG_LEVEL=1: the FontDecompressor's own LOG_ERR lines are worth seeing (a failed transient
; allocation would otherwise look like a fast glyph), but its LOG_TRC per-pass counters would bury
; the results.
; Keeps base's full lib_deps, unlike env:bench which trims to SaxParser alone. That is not
; laziness: PlatformIO compiles every source in a discovered library directory, and lib/EpdFont
; holds SdCardFont.cpp, which needs HalStorage and SdFat -- so the font path cannot be linked
; without the HAL, and trimming lib_deps only trades this build for a longer list of link errors.
; Nothing but the benchmark runs, so the unused code costs build time and nothing else.
[env:bench_font]
extends = base, firmware_tuned
; NOT bench/platform_stubs.c: that exists for env:bench, which links no HAL and so has to supply
; the --wrap symbols itself. Here HalSystem.cpp already defines the two panic wraps, and defining
; them twice is a link error. Only the efuse wrap has no other provider, so it is pulled from src.
build_src_filter = -<*> +<../bench/font_main.cpp> +<platform/skip_efuse_blk_check.c>
build_flags =
  ${c3.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  ; scripts/git_branch.py only injects this for `default` and the *gh_release_rc envs, and
  ; HalSystem.cpp pastes it straight into a string literal.
  -DCROSSPOINT_VERSION='"bench"'

[env:bench_glyph_store]
; bench_font's build with another sketch.
extends = env:bench_font
build_src_filter = -<*> +<../bench/glyph_store_main.cpp> +<platform/skip_efuse_blk_check.c>

[env:bench_ttf_raster]
; bench_font's build with another sketch, and Bookerly Regular embedded in the image for it to render.
extends = env:bench_font
build_src_filter = -<*> +<../bench/ttf_raster_main.cpp> +<platform/skip_efuse_blk_check.c>
board_build.embed_files = lib/EpdFont/builtinFonts/source/Bookerly/Bookerly-Regular.ttf

; ---------------------------------------------------------------------------
; Xteink X4 Pro — ESP32-S3, SSD1677 800x480 + GT911 touch + warm/cold frontlight.
; Board notes: docs/contributing/board-support.md.
; Build & flash: pio run -e x4pro -t upload
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; X4 Pro board configuration, shared by the dev env and the two release envs
; below. Not an env itself -- interpolation only, like [c3], [s3] and
; [lilygo_board]. Everything that identifies the BOARD lives here; the envs
; add only what identifies the BUILD (version string, log level).
; ---------------------------------------------------------------------------
[x4pro_board]
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; DIO flash + octal PSRAM, and NOT the board manifest's default.
;
; esp32-s3-devkitc1-n16r8.json declares memory_type "qio_opi" and flash_mode
; "qio". [base] overrides board_build.flash_mode to dio, but memory_type is a
; SEPARATE knob: it selects which prebuilt Arduino variant is linked, and the
; qio_opi variant brings a core built for quad-IO flash. Leaving it at the
; default therefore linked a QIO core behind a DIO flash header — the two
; disagree about how many data lines the flash has and which pads carry them.
;
; Upstream/develop names dio_opi explicitly on every X4 Pro env, and that is the
; configuration the replacement unit is running, so match it rather than rely on
; a board default that was written for a devkit and not for this hardware.
board_build.arduino.memory_type = dio_opi
build_flags =
  ${s3.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
; USB Drive. Note this env extends `base`, NOT `firmware_tuned`: the custom SDK
; core rebuild omits the prebuilt TinyUSB component graph that USBMSC links
; against (see the warning on [firmware_tuned] above). This does NOT change the
; board's USB personality at build time — ARDUINO_USB_MODE stays 1 so USB
; Serial/JTAG remains what PlatformIO monitors and flashes; the shared PHY is
; switched to OTG at runtime only for the duration of a transfer, and handed
; back by handoffUsbOtgToSerialJtag() before the exit reboot.
  -DFREEINK_CAP_USB_MSC=1
; The module is an ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB octal PSRAM. The
; board manifest already puts this in build.extra_flags; stated here too so the
; env does not silently lose PSRAM if that manifest ever changes, matching
; upstream/develop.
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
; X4 Pro's SD is native SDMMC (1-bit), mounted through SdFat's block-device API
; rather than the SPI path the C3 boards use.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4pro]
extends = base, x4pro_board
build_flags =
  ${x4pro_board.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DSERIAL_TEST_API=1 ; see [env:default]

; X4 Pro counterparts of [env:gh_release] / [env:gh_release_rc]. The release
; asset built from these is firmware-x4pro.bin, which is the name the
; firmware's own OTA check asks GitHub for (see FirmwareBoardTag.h).
[env:x4pro_gh_release]
extends = base, x4pro_board
build_flags =
  ${x4pro_board.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:x4pro_gh_release_rc]
extends = base, x4pro_board
build_flags =
  ${x4pro_board.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py from the CI RC tag
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; ---------------------------------------------------------------------------
; LilyGo T5S3 board configuration, shared by the dev env and the two release
; envs below. Not an env itself — interpolation only, like [c3] and [s3].
; Everything that identifies the BOARD lives here; the envs add only what
; identifies the BUILD (version string, log level).
; ---------------------------------------------------------------------------
[lilygo_board]
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; The module is an ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB OPI PSRAM. Both
; lines are required for the PSRAM to be initialised at all — memory_type picks
; the flash/PSRAM pin mode (quad flash + octal PSRAM), and without it the RAM is
; simply absent. Unlike the X4 Pro, this board CANNOT run without it: the panel
; is 960x540 16-gray, so LovyanGFX's framebuffer does not fit in the S3's
; internal RAM alongside the reader. Matches upstream/feat-touch's env.
; qio matches upstream/feat-touch. Tested against dio on 2026-08-17 because the
; hardware RST button left this board frozen rather than rebooting: flash mode
; made NO difference, so it is not the cause and we keep upstream's setting.
; See the reset-button note in docs/contributing/board-support.md ("LilyGo T5S3").
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${s3.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_LILYGO=1
; Bring-up aid: log every raw button edge (index + name + live mask) as
; InputManager reports it, before any mapping or press-type handling. Covers
; expander-backed buttons that the SDK's ADC-ladder diagnostic cannot see.
; Drop this once the board's input is settled.
; -DBUTTON_TRACE=1
; Panel diagnostic, off by default: split each graded (grayscale) push into
; sprite write / refresh / settle, name the epd_mode the refresh actually went
; out under, and trace the plain B/W push alongside it so EVERY refresh appears.
; That last part is what made the AA->BW degradation tractable — one push and a
; slow waveform are indistinguishable when only one of the two is traced. Kept
; rather than deleted: it is the tool for the next panel question.
; -DLGFX_EPD_PUSH_TRACE=1
; The board carries a PCF8563TS RTC at 0x51 (vendor schematic page 3 / U3; the
; README's "PCF85063" is wrong and the vendor's own notes say to trust the
; schematic). The SDK's default FREEINK_CAP_RTC list does not include LILYGO, so
; without this the Rtc lib links stub bodies and begin() always returns false.
  -DFREEINK_CAP_RTC=1
; USB Drive. The vendor pinmap (docs/pinmap.md in Xinyuan-LilyGO/T5S3-4.7-e-paper-PRO)
; puts USB D-/D+ on GPIO19/20 straight off the ESP32-S3 — net DM/DP, schematic
; page 1/2, no CH340/CP2102 bridge in between — so this board has real native USB
; and can enumerate as a mass-storage device just like the X4 Pro. Its SD is on
; the shared SPI bus (SCLK14 MISO21 MOSI13 CS12) rather than SDMMC, which is why
; the SDK had to grow an SPI-path raw block device for this to work at all.
;
; As on the X4 Pro this needs the prebuilt Arduino core for TinyUSB, which the
; lilygo envs already get by extending `base` rather than `firmware_tuned`.
  -DFREEINK_CAP_USB_MSC=1
  -DFREEINK_LGFX_EPD_CONFIG=lilygoT5S3LgfxConfig
lib_deps =
  ${base.lib_deps}
  BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3
; Pinned to the upstream git tag, NOT the PlatformIO registry: the registry has
; pruned 0.2.20 and now serves only 0.2.27/0.2.28/0.1.17, so
; "m5stack/M5GFX @ 0.2.20" resolves for nobody without a stale local cache. The
; git tag still exists and is the exact code this board was brought up against,
; so this keeps the validated version instead of bumping the graphics library
; underneath an unvalidated panel. Verify with: pio pkg show m5stack/M5GFX
  M5GFX=https://github.com/m5stack/M5GFX.git#0.2.20

[env:lilygo_t5s3]
extends = base, lilygo_board
build_flags =
  ${lilygo_board.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-lilygo\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DSERIAL_TEST_API=1 ; see [env:default]

; LilyGo counterparts of [env:gh_release] / [env:gh_release_rc]. The release
; asset built from these is firmware-lilygo.bin, which is the name the
; firmware's own OTA check asks GitHub for (see FirmwareBoardTag.h).
[env:lilygo_gh_release]
extends = base, lilygo_board
build_flags =
  ${lilygo_board.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-lilygo\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:lilygo_gh_release_rc]
extends = base, lilygo_board
build_flags =
  ${lilygo_board.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py from the CI RC tag
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
