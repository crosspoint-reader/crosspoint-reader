name=ESP32Drop
version=0.1.0
author=MIRO
maintainer=MIRO <mobilehackerz@gmail.com>
sentence=Send and receive AirDrop files on an ESP32-S3 by speaking Apple Wireless Direct Link.
paragraph=Receives files from a Mac or an iPhone that picks the device in the share sheet, and sends a file of any type to a Mac or an iPhone that is listening (you pass a MIME type or an Apple UTI, or common image and document types are read from the leading bytes). The two ends connect directly: no pairing, no account, no access point. Receiving and sending are separate builds, because the ESP32 does not have the memory for both at once; define ESP32DROP_SENDER for the sending one. Needs an ESP32-S3 with PSRAM, since a transfer is decoded there. TAKES THE RADIO EXCLUSIVELY: AWDL runs on 2.4 GHz channel 6 in step with the mesh availability window, so the interface cannot be shared with WiFi.begin(). Transmit timing runs on a dedicated high-priority task, so heavy work in loop() is fine. An independent re-implementation of AWDL and the AirDrop protocol, not affiliated with or endorsed by Apple Inc.
category=Communication
architectures=esp32
includes=ESP32Drop.h,ESP32AWDL.h
license=0BSD
