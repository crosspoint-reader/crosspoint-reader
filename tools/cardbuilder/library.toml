# Pocket Library — what goes on the card.
#
# Each [[collection]] is one Kiwix ZIM, looked up by its catalog name. The
# newest edition in the first flavour that exists is used ("nopic" = text
# without pictures). "key" is the folder name under /library on the card.
# optional = true: skip with a warning if the catalog does not have it.
# Names marked "unconfirmed" come from memory, not a live catalog check;
# `cardbuilder.py plan` reports any that do not resolve.

[settings]
# Downloads and indexes live here. Wikipedia with pictures alone is 127 GB, so
# an external drive is best, e.g. staging = "/Volumes/MyDrive/PocketLib".
staging = "~/PocketLib/downloads"
# card = "/Volumes/POCKETLIB"    # or pass --card; check the name with: ls /Volumes

# --- core ---------------------------------------------------------------------
[[collection]]
key = "wikipedia"
name = "wikipedia_en_all"
flavour = ["maxi", "nopic"]   # with pictures, ~127 GB; for text only (~49 GB, fits a 128 GB card) use ["nopic"]

[[collection]]
key = "wiktionary"
name = "wiktionary_en_all"
flavour = ["nopic"]
note = "Also converted to a StarDict dictionary for word lookups (later in M2)."

[[collection]]
key = "wikivoyage"
name = "wikivoyage_en_all"
flavour = ["maxi", "nopic"]   # with pictures: the first test of article images (owner, 2026-10-03)

[[collection]]
key = "wikiquote"
name = "wikiquote_en_all"
flavour = ["nopic"]

# --- medicine and first aid ---------------------------------------------------------
[[collection]]
key = "wikiprojectmed"
name = "mdwiki_en_all"
flavour = ["nopic", "maxi"]
note = "WikiProjectMed Foundation's medical encyclopedia (mdwiki.org)."

[[collection]]
key = "medlineplus"
name = "medlineplus.gov_en_all"
flavour = ["", "maxi"]
optional = true
note = "unconfirmed name: US National Library of Medicine consumer health pages."

[[collection]]
key = "pets"
file = "pets_en_msd_*.zim"
optional = true
note = "Made on the Mac: python3 webpack.py recipes/pets.toml STAGING (MSD Veterinary Manual pet-owner emergencies and poisoning; personal copy)."

# Post-disaster resources (zimgit-post-disaster_en) dropped 2026-10-03: it is
# PDFs behind a JavaScript viewer page, and the device reads neither.

[[collection]]
key = "military-medicine"
name = "fas-military-medicine_en"
flavour = [""]
optional = true
note = "unconfirmed name: US military field-medicine manuals (public domain)."

# --- books ------------------------------------------------------------------------
[[collection]]
key = "wikisource"
name = "wikisource_en_all"
flavour = ["nopic"]

[[collection]]
key = "wikibooks"
name = "wikibooks_en_all"
flavour = ["nopic"]

# Project Gutenberg (gutenberg_en_all) was tried and dropped on 2026-10-03:
# Kiwix ships it only with covers, 221.3 GB, which does not fit the 256 GB card.
# Books come from Standard Ebooks instead: EPUBs, not ZIMs (CrossPoint already
# reads EPUB). They get their own step later in M2.
