<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--#include file="shared/ThemeInit.html.inc" -->
  <title>%%CROSSPOINT%%</title>
  <style>
    <!--#include file="shared/Theme.css.inc" -->

    /* The start page: a launch card, no header bar. The shared nav links are its buttons, so
       shared/NavLinks.css.inc (the header bar's styles) is not included. */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top, var(--accent-soft), transparent 45%), var(--bg);
    }

    .launch {
      width: min(100%, 400px);
      margin: 0;
      padding: 32px 24px 24px;
      text-align: center;
      box-shadow: var(--shadow-raised);
    }

    .logo { font-size: 3.25rem; line-height: 1; margin-bottom: 14px; }
    .launch h1 { font-size: 1.85rem; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
    .subtitle { margin: 6px 0 0; color: var(--text-muted); }
    .version { margin: 4px 0 0; font-size: 0.9rem; color: var(--accent-text); }

    .launch .nav-links { display: grid; gap: 10px; margin-top: 24px; }
    .launch .nav-links a {
      display: block;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.15s, color 0.15s;
    }
    .launch .nav-links a:hover { background: var(--accent); color: var(--on-accent); }

    .footer { margin: 20px 0 0; color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>

<body>
  <main class="card launch">
    <div class="logo" aria-hidden="true">📚</div>
    <h1>%%CROSSPOINT%%</h1>
    <p class="subtitle">Welcome to your reader</p>
    <p class="version" id="version">&nbsp;</p>
    <!--#include file="shared/NavLinks.html.inc" -->
    <p class="footer">Fast start page designed for weak connections</p>
  </main>
  <script>
    // Asked for rather than built in: this page is served from the SD card bundle,
    // which a firmware update keeps when the pages themselves did not change.
    fetch('/api/status/fast')
      .then((r) => r.json())
      .then((s) => { document.getElementById('version').textContent = 'Version ' + s.version; })
      .catch(() => {});
  </script>
</body>

</html>
