<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fonts - CrossPoint Reader</title>
    <style>
      h3 { margin: 0 0 8px 0; }
      .family-info { flex: 1; }
      .family-meta { color: var(--label-color); font-size: 0.9em; }
      .font-upload-form {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .font-upload-form input[type="file"] { flex: 1; min-width: 200px; }
    </style>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
  </head>
  <body class="web-ui">
    <!--#include file="shared/Header.html.inc" -->
<main class="page-content">


    <div class="card">
      <h2>Installed Fonts</h2>
      <div id="families"><p class="empty-state">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Upload Font</h2>
      <p class="family-meta" style="margin: 0 0 12px;">Choose the folder that contains one font family. The picker selects folders, not single files.</p>
      <form class="font-upload-form" id="uploadForm">
        <input type="file" id="fontFiles" webkitdirectory directory multiple required />
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>
      <p id="pickedInfo" class="family-meta" style="margin: 8px 0 0;"></p>
    </div>

    </main>
<!--#include file="shared/Footer.html.inc" -->
  <script>
    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    // PSRAM boards also accept vector (.ttf/.otf) uploads; set from /api/fonts.
    let allowVector = false;

    function fontExtRe() {
      return allowVector ? /\.(cpfont|ttf|otf)$/i : /\.cpfont$/i;
    }

    function supportedExts() {
      return allowVector ? '.cpfont, .ttf or .otf' : '.cpfont';
    }

    async function loadFonts() {
      const el = document.getElementById('families');
      try {
        const res = await fetch('/api/fonts');
        // Non-OK replies have no families; report a failed load, not "No fonts installed".
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allowVector = !!data.vectorFonts;
        // Build rows with DOM APIs and textContent so on-device family names
        // (which can contain arbitrary characters) cannot break markup or
        // execute script via innerHTML / inline onclick interpolation.
        el.replaceChildren();
        if (!data.families || data.families.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty-state';
          p.textContent = 'No fonts installed';
          el.appendChild(p);
          return;
        }
        for (const f of data.families) {
          const row = document.createElement('div');
          row.className = 'family';

          const info = document.createElement('div');
          info.className = 'family-info';
          const h3 = document.createElement('h3');
          h3.textContent = f.name;
          info.appendChild(h3);
          const meta = document.createElement('span');
          meta.className = 'family-meta';
          // Vector families report size 0 (rendered at any size).
          const sizes = (f.sizes || []).filter(s => s > 0);
          const sizeText = sizes.length ? sizes.join(', ') + 'pt' : 'scalable';
          const filesSizes = (f.files || []).map(fi => formatSize(fi.size)).join(' + ');
          meta.textContent = sizeText + ' · ' + filesSizes;
          info.appendChild(meta);

          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = 'Delete';
          // Capture name in the closure rather than interpolating into onclick.
          const familyName = f.name;
          btn.addEventListener('click', () => deleteFamily(familyName));

          row.appendChild(info);
          row.appendChild(btn);
          el.appendChild(row);
        }
      } catch (e) {
        el.replaceChildren();
        const p = document.createElement('p');
        p.className = 'empty-state';
        p.textContent = 'Failed to load font list';
        el.appendChild(p);
      }
    }

    async function deleteFamily(name) {
      if (!await showWebConfirm('Delete font family "' + name + '"?')) return;
      try {
        const res = await fetch('/api/fonts/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({family: name})
        });
        if (res.ok) {
          showWebToast('Deleted "' + name + '".', false);
        } else {
          showWebToast('Failed to delete "' + name + '".', true);
        }
      } catch (err) {
        showWebToast('Delete error: ' + err.message, true);
      }
      await loadFonts();
    }

    // Derive family name from a font filename: take everything before the
    // last '-' or '_' (that separator precedes the size suffix for .cpfont,
    // e.g. Bookerly_12.cpfont, or the style token for vector fonts, e.g.
    // Bookerly-Bold.ttf).
    function familyFromFilename(name) {
      const stem = name.replace(/\.(cpfont|ttf|otf)$/i, '');
      const cut = Math.max(stem.lastIndexOf('-'), stem.lastIndexOf('_'));
      return cut > 0 ? stem.slice(0, cut) : stem;
    }

    // Sanitize to match firmware's [A-Za-z0-9_-]+ pattern.
    function sanitizeFamily(raw) {
      return raw.replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function supportedFontFilesOnly(fileList) {
      return Array.from(fileList).filter(f => fontExtRe().test(f.name));
    }

    document.getElementById('fontFiles').addEventListener('change', function() {
      const info = document.getElementById('pickedInfo');
      const files = supportedFontFilesOnly(this.files);
      if (files.length === 0) {
        info.textContent = 'No ' + supportedExts() + ' files found in the selected folder.';
        return;
      }
      const family = sanitizeFamily(familyFromFilename(files[0].name));
      info.textContent = files.length + ' file' + (files.length === 1 ? '' : 's') +
        ' → family "' + family + '"';
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const files = supportedFontFilesOnly(document.getElementById('fontFiles').files);
      if (files.length === 0) {
        showWebToast('No ' + supportedExts() + ' files selected.', true);
        return;
      }

      // A directory picker may include files from multiple family subfolders.
      // Reject that up front — otherwise files[0]'s family is silently reused
      // for every upload, corrupting the install layout.
      const families = [...new Set(files.map(f => sanitizeFamily(familyFromFilename(f.name))))];
      if (families.length !== 1) {
        showWebToast('Please select files from a single font family.', true);
        return;
      }
      const family = families[0];

      let uploaded = 0;
      for (const file of files) {
        // Re-shown (and its auto-hide timer reset) on every file, so the
        // toast stays up for the whole upload rather than disappearing
        // mid-way through a multi-file transfer.
        showWebToast('Uploading ' + (uploaded + 1) + '/' + files.length + ': ' + file.name, false);
        const formData = new FormData();
        formData.append('family', family);
        formData.append('file', file, file.name);
        try {
          const res = await fetch('/api/fonts/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (!data.ok) {
            showWebToast('Failed on ' + file.name + ': ' + (data.error || 'unknown error'), true);
            await loadFonts();
            return;
          }
        } catch (err) {
          showWebToast('Upload error on ' + file.name + ': ' + err.message, true);
          await loadFonts();
          return;
        }
        uploaded++;
      }

      showWebToast('Uploaded ' + uploaded + ' file' + (uploaded === 1 ? '' : 's') +
        ' to family "' + family + '".', false);
      await loadFonts();
    });

    loadFonts();
  </script>
  </body>
</html>
