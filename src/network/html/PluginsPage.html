<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plugins - CrossPoint Reader</title>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
<style>
  #plugin-picker { position: sticky; top: 72px; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  #plugin-picker[hidden] { display: none; }
  #plugin-picker label { font-weight: 600; }
  #plugin-select { flex: 1; min-width: 170px; max-width: 440px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--font-color); font: inherit; }
  #plugin-container > .card { scroll-margin-top: 160px; }
  @media (max-width: 600px) { #plugin-select { max-width: none; } }
</style>
</head>
<body class="web-ui">
  <!--#include file="shared/Header.html.inc" -->
<main class="page-content">
  <div class="card" id="plugin-picker" hidden>
    <label for="plugin-select">Jump to plugin</label>
    <select id="plugin-select" aria-label="Jump to installed plugin">
      <option value="" selected>Choose an installed plugin</option>
    </select>
  </div>
  <div id="plugin-container"></div>
  <div class="card" id="empty-state" hidden>
    <p class="empty-state">No plugins installed. Check that <b>Settings &rarr; Connectivity &rarr; Plugins</b> is on and that a plugin is installed on the SD card.</p>
  </div>
</main>
<!--#include file="shared/Footer.html.inc" -->

<script src="/js/plugin-host.js"></script>
<script>
  (async () => {
    const picker = document.getElementById('plugin-picker');
    const select = document.getElementById('plugin-select');
    select.addEventListener('change', () => {
      if (!select.value) return;
      const target = document.getElementById(select.value);
      if (target) {
        target.tabIndex = -1;
        target.scrollIntoView({behavior: 'smooth', block: 'start'});
        target.focus({preventScroll: true});
      }
    });
    const onDiscovered = plugins => {
      if (!plugins.length) return;
      for (const plugin of plugins) {
        const option = document.createElement('option');
        option.value = 'plugin-' + plugin.name;
        option.textContent = (plugin.title || plugin.name) +
          (plugin.version ? ' — v' + String(plugin.version).replace(/^v/i, '') : '');
        select.appendChild(option);
      }
      picker.hidden = false;
    };
    // The plugin host and the plugin list are separate requests and can fail on a busy device.
    if (typeof loadPlugins !== 'function' || !(await loadPlugins('settings', null, onDiscovered))) {
      document.querySelector('#empty-state p').textContent = 'Could not load plugins. Reload the page.';
    } else if (document.getElementById('plugin-container').children.length) {
      return;
    }
    document.getElementById('empty-state').hidden = false;
  })();
</script>
</body>
</html>
