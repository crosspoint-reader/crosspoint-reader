# Posts (and keeps updated) a comment on each PR linking the firmware artifacts
# and the web interface bundle that CI built for its head commit, so a change can
# be flashed without digging through the Actions UI.
#
# Ported from crosspoint-reader PR #3389 (Uri Tauber / @uritauber). The logic is
# theirs; the board list is ours and must track ci.yml's build matrix.
#
# Runs on workflow_run, so it is the version of this file on the DEFAULT BRANCH
# that executes, not the version in the PR. Edits to it therefore do nothing
# until merged -- including this one.
name: PR firmware links

on:
  workflow_run:
    workflows:
      - CI (build)
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  update-comment:
    if: github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: pr-firmware-links-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Update firmware links comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-firmware-artifacts -->';
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner) {
              core.notice(`No head repository found for ${run.head_sha}.`);
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${headOwner}:${run.head_branch}`,
              state: 'all',
              per_page: 100,
            });
            const associatedPullRequest = pullRequests.find(
              (pr) => pr.state === 'open' && pr.head.sha === run.head_sha,
            );

            if (!associatedPullRequest) {
              core.notice(`No pull request found for ${run.head_sha}.`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: associatedPullRequest.number,
            });

            if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
              core.notice(`Skipping closed or superseded workflow run for ${run.head_sha}.`);
              return;
            }

            // Must match the build matrix in ci.yml (its `asset:` values). A name
            // listed here that the run does not produce suppresses the whole
            // comment, so the two lists have to move together.
            const builds = [
              { name: 'firmware.bin', device: 'X3 / X4' },
              { name: 'firmware-x4pro.bin', device: 'X4 Pro' },
              { name: 'firmware-lilygo.bin', device: 'LilyGo T5S3' },
            ];
            const { data: artifactResponse } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
            const artifacts = new Map(
              artifactResponse.artifacts
                .filter((artifact) => !artifact.expired)
                .map((artifact) => [artifact.name, artifact]),
            );
            const missingBuilds = builds.filter((build) => !artifacts.has(build.name));
            // The web interface bundle, web-<hash>.bin, uploaded on its own by ci.yml. Optional,
            // unlike the builds above: a PR branched before ci.yml uploaded it has none, and
            // its firmware ZIPs still carry the bundle.
            const webBundle = [...artifacts.values()].find((artifact) =>
              /^web-[0-9a-f]+\.bin$/.test(artifact.name),
            );
            const artifactUrl = (artifact) =>
              `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            const shortSha = run.head_sha.slice(0, 7);
            let body = `${marker}\n### Firmware builds\n\n`;

            if (missingBuilds.length === 0) {
              const links = builds.map(({ name, device }) => {
                const artifact = artifacts.get(name);
                return `- [${device} (\`${name}\`)](${artifactUrl(artifact)})`;
              });
              if (webBundle) {
                links.push(
                  `- [Web interface, every device (\`${webBundle.name}\`)](${artifactUrl(webBundle)})`,
                );
              }
              body += `Automatically generated for the latest commit of this PR (\`${shortSha}\`).\n\n`;
              body += `${links.join('\n')}\n\n`;
              body += 'Download the file for your device, extract the `firmware*.bin` from the ZIP, then flash it with ';
              body += '[CrossPoint Reader Flash Tools](https://crosspointreader.com/#flash-tools). ';
              body += '**Make sure you use the correct firmware file for your device.**\n\n';
              body += 'The web interface lives on the SD card and must match the firmware. A PR build is not ';
              body += 'published, so when the device shows the setup page it cannot download the pages itself: ';
              body += 'extract the `web-….bin` from its ZIP and choose it under *Install from a file*, or copy it ';
              body += 'to the top folder of the SD card. ';
              body += webBundle
                ? 'Each firmware ZIP holds the same file.'
                : 'It is in each firmware ZIP, next to the firmware.';

              if (run.conclusion !== 'success') {
                body += `\n\n> The firmware builds succeeded, but [another CI check finished with ${run.conclusion}](${run.html_url}).`;
              }
            } else {
              const missingNames = missingBuilds.map(({ name }) => `\`${name}\``).join(', ');
              body += `Firmware is not available for the latest commit of this PR (\`${shortSha}\`). `;
              body += `The build did not produce ${missingNames}. [View the CI run](${run.html_url}).`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }
