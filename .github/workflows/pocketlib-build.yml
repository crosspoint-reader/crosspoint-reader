# Pocket Library — build the X4 Pro firmware on GitHub's servers.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Runs on every push to the pocket-library branch and to claude/* review
# branches (and on demand from the Actions tab). Produces three downloads under the run's "Artifacts":
#   stock-1.6.5-x4pro      official CrossPoint 1.6.5 for X4 Pro, built from
#                           upstream's tag: the known-good fallback
#   pocketlib-x4pro        our firmware (x4pro-pocketlib-release)
#   zimcat-macos           zimcat and zimindex, the ZIM command-line tools, for
#                           Intel and Apple-silicon Macs
# Each comes with a .sha256 so the file you flash can be checked. All of them
# are also published to the rolling "dev" pre-release on the Releases page.
# X4 Pro (ESP32-S3) only: no C3 environment is ever built here.

name: Pocket Library build

on:
  push:
    branches: [pocket-library, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, newest last, so the dev release always ends on the
# latest commit (two overlapping runs could otherwise publish out of order).
concurrency:
  group: pocketlib-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stock-1.6.5-x4pro
            repository: crosspoint-reader/crosspoint-reader
            ref: "1.6.5"
            env: x4pro-gh_release
          - name: pocketlib-x4pro
            repository: ${{ github.repository }}
            ref: ${{ github.sha }}
            env: x4pro-pocketlib-release
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same toolchain pins as upstream's release.yml at 1.6.5.
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.env }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build
        run: |
          # Pocket Library builds name their commit on Settings > About.
          export POCKETLIB_BUILD="${GITHUB_SHA::7}"
          pio run -e "${{ matrix.env }}" -j1

      - name: Prepare files
        run: |
          set -euo pipefail
          mkdir out
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "out/${{ matrix.name }}.bin"
          # Symbols for decoding crash_report.txt addresses (artifact only, not the release).
          cp ".pio/build/${{ matrix.env }}/firmware.elf" "out/${{ matrix.name }}.elf"
          (cd out && sha256sum "${{ matrix.name }}.bin" > "${{ matrix.name }}.bin.sha256")
          ls -l out
          cat out/*.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  zimcat-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build universal zimcat and zimindex (Intel + Apple silicon)
        run: |
          cmake -S lib/zim -B build/zim -DCMAKE_BUILD_TYPE=Release -DZIM_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/zim -j --target zimcat zimindex
          lipo -info build/zim/zimcat build/zim/zimindex
          mkdir out && cp build/zim/zimcat build/zim/zimindex out/
          cp tools/cardbuilder/cardbuilder.py tools/cardbuilder/library.toml tools/books/booklist.py out/
          cp tools/webpack/webpack.py tools/webpack/zimwrite.py tools/webpack/recipes/pets.toml out/
          cp tools/flash/flash.sh tools/cardbuilder/get-tools.sh out/
          (cd out && for f in zimcat zimindex cardbuilder.py library.toml booklist.py webpack.py zimwrite.py pets.toml \
            flash.sh get-tools.sh; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v6
        with:
          name: zimcat-macos
          path: out/
          if-no-files-found: error
          retention-days: 90

  # Rolling pre-releases with plain download links on the Releases page:
  # "dev" is the latest build of pocket-library; "preview" is the latest build
  # of a claude/* review branch, so a change can be tried on the device before
  # it is merged without replacing the known-good dev build.
  publish-dev:
    needs: [build, zimcat-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          short="${GITHUB_SHA::7}"
          tag=dev
          what="Development build"
          if [ "$GITHUB_REF_NAME" != "pocket-library" ]; then
            tag=preview
            what="Preview build (${GITHUB_REF_NAME})"
          fi
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "${what} ${short}" \
            --notes "Latest build of ${GITHUB_REF_NAME} (commit ${short}). X4 Pro only.
          How to make your own: https://github.com/${GITHUB_REPOSITORY}/blob/pocket-library/docs/pocket-library/README.md
          - flash.sh: installs the firmware from a Mac's Terminal (bash flash.sh), with a full backup first.
          - get-tools.sh: fetches the card-building tools below into ~/PocketLib/cardbuilder.
          - pocketlib-x4pro.bin: Pocket Library firmware. Or flash it with crosspointreader.com, Xteink X4 Pro, Custom .bin.
          - stock-1.6.5-x4pro.bin: unmodified CrossPoint 1.6.5, the known-good fallback.
          - zimcat: command-line ZIM reader for macOS (Intel and Apple silicon).
          - zimindex: builds the search index (.pltitles) the device uses, for macOS.
          - cardbuilder.py + library.toml: builds the microSD card (python3 cardbuilder.py plan).
          - booklist.py: lists, prunes and tidies a folder of ebooks before they go on the card.
          - webpack.py + zimwrite.py + pets.toml: optional, makes the Pet First Aid pack (personal use).
          Each file has a .sha256 alongside it."
