name: CI (build)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  rust:
    name: Rust (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      # The framework must stay device-generic: no product-specific code.
      - name: Check framework has no CrossPoint code
        run: |
          if grep -rniE "crosspoint|xteink" lib/cpui_rs/src/; then
            echo "cpui must not reference CrossPoint or Xteink" >&2
            exit 1
          fi

      - name: Lint
        run: cargo clippy --workspace --all-targets --features cpui-rs/testing -- -D warnings

      - name: Test
        run: cargo test --workspace --features cpui-rs/testing

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build-default:
    name: Build default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # The firmware links a Rust staticlib, so the device targets must be
      # available or every environment below fails at the cargo step.
      # `default` is ESP32-C3 (RISC-V, stable); `sticky` is
      # ESP32-S3 (Xtensa), which needs the esp-rs fork and rust-src.
      - name: Cache Rust toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-esp-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: rust-esp-${{ runner.os }}-

      - name: Install Rust device targets
        run: |
          set -euo pipefail
          rustup target add riscv32imc-unknown-none-elf
          if [ ! -d "$HOME/.rustup/toolchains/esp" ]; then
            cargo install espup --locked
            espup install
          fi

      - name: Build default firmware
        run: |
          set -euo pipefail
          pio run -e default | tee pio.log

      # scripts/report_memory.py already fails the build on a budget breach; this
      # only surfaces the figures. It reads the memory.json each environment
      # writes rather than scraping the log: the ESP32 build links twice, so the
      # log holds two different figures per environment and the first is a
      # partial image.
      - name: Extract firmware stats
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          print("## Firmware size\n")
          print("| Environment | Flash | Static RAM | of which Rust |")
          print("|---|---|---|---|")

          for env_name in ("default", "sticky"):
              path = pathlib.Path(".pio/build") / env_name / "memory.json"
              if not path.exists():
                  print(f"| {env_name} | n/a | n/a | n/a |")
                  continue
              d = json.loads(path.read_text())
              fmt = lambda v: f"{v:,} B" if isinstance(v, int) else "n/a"
              print(
                  f"| {env_name} | {fmt(d['flash'])} | {fmt(d['static_ram'])} "
                  f"| {fmt(d['rust_flash'])} |"
              )

          print("\nStatic RAM is `.data/.bss/.noinit` only, not the heap.")
          print("Budgets live in `memory-budget.json`.")
          PY

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware.bin
          path: .pio/build/default/firmware.bin
          if-no-files-found: error

      # Needed to attribute a size regression to a library; CI previously kept
      # no map, so a PR had nothing to diff against.
      - name: Upload link maps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firmware-maps
          path: .pio/build/*/firmware.map
          if-no-files-found: warn

  build-sticky:
    name: Build sticky
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build sticky firmware
        run: |
          set -euo pipefail
          pio run -e sticky | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Sticky firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build-default
      - build-sticky
      - clang-format
      - cppcheck
      - rust
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
