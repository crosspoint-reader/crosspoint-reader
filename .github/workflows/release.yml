name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release: plain
# firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for every other
# board. Attach the artifacts' .bin files to the release as-is.

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
          - pio_env: sticky-gh_release
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  # Languages left out of the firmware ship as .cplang packs for the SD card. A pack is
  # indexed by string-key position and refuses to load when the count differs, so it only
  # works with the build it came from. Built from the same tag, attached to the same release.
  language-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate language packs
        run: |
          # Read the built-in set from platformio.ini so the packs are exactly the
          # complement of what the firmware carries.
          BUILTIN=$(sed -n 's/^custom_i18n_builtin_langs *= *//p' platformio.ini | head -1)
          if [ -z "$BUILTIN" ]; then
            echo "custom_i18n_builtin_langs missing from platformio.ini" >&2
            exit 1
          fi
          echo "Built-in languages: $BUILTIN"
          # --strip-unused: the pre-build hook uses it, so the key counts must agree.
          python3 scripts/gen_i18n.py lib/I18n/translations lib/I18n/ \
            --strip-unused --builtin-langs "$BUILTIN" --pack-dir dist/lang
          # At the default `all` there is nothing to ship. Skip the steps below rather than
          # attach an empty zip to every release.
          COUNT=$(find dist/lang -name '*.cplang' | wc -l | tr -d ' ')
          echo "Generated $COUNT pack(s)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        id: packs

      - name: Bundle packs
        if: steps.packs.outputs.count != '0'
        run: |
          cd dist
          zip -r ../language-packs.zip lang

      - name: Upload Artifacts
        if: steps.packs.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: language-packs
          path: |
            language-packs.zip
            dist/lang/*.cplang
