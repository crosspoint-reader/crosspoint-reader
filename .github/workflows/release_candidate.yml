name: Publish Release Candidate

# Same asset naming as release.yml: plain firmware.bin for the combined C3
# X3/X4 binary, firmware-<board>.bin for every other board — the names the
# firmware's own OTA check asks GitHub for (src/network/FirmwareBoardTag.h).
#
# Three jobs, because the RC tag has to exist before the builds (it is compiled
# into the firmware as CROSSPOINT_VERSION) and the prerelease must be created
# exactly once: prepare -> build (one leg per board) -> publish.

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Determine next RC tag
        id: rc
        run: |
          VERSION="$(python3 - <<'PY'
          import configparser

          config = configparser.ConfigParser()
          config.read("platformio.ini")
          version = config["crosspoint"]["version"].strip()
          if version.count(".") == 1:
              version = f"{version}.0"
          print(version)
          PY
          )"

          NEXT_RC="$(python3 - "$VERSION" <<'PY'
          import re
          import subprocess
          import sys

          version = sys.argv[1]
          pattern = re.compile(rf"^{re.escape(version)}-rc\.(\d+)(?:\.\d+)?$")

          highest = 0
          tags = subprocess.check_output(
              ["git", "tag", "-l", f"{version}-rc.*"],
              text=True,
          )
          for tag in tags.splitlines():
              match = pattern.match(tag)
              if match:
                  highest = max(highest, int(match.group(1)))

          print(highest + 1)
          PY
          )"

          echo "rc_tag=${VERSION}-rc.${NEXT_RC}" >> "$GITHUB_OUTPUT"

  build-release-candidate:
    name: Build (${{ matrix.label }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gh_release_rc
            label: X3/X4
            asset: firmware.bin
          - env: x4pro_gh_release_rc
            label: X4 Pro
            asset: firmware-x4pro.bin
          - env: lilygo_gh_release_rc
            label: LilyGo T5S3
            asset: firmware-lilygo.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # terser minifies the inline JS in the embedded web pages (see
      # scripts/build_html.py). Without it the build still succeeds, but the
      # generated pages are ~17% larger - so CI installs it to match a release.
      - name: Install web asset tooling
        run: npm ci

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # Keyed per env: the C3 and S3 legs pull different toolchain packages, so
      # a shared key would have the two legs overwriting each other's cache.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v2-${{ runner.os }}-${{ matrix.env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig / custom_component_remove (every C3 env, via
          # [firmware_tuned]) run a nested `pio run` from ~/.platformio/penv. Platform
          # 55.03.311 bootstraps that penv with an open-ended "pioarduino>=6.1.19", which
          # now resolves to 6.2.0. That core wants tool-scons 4.11.1 where the platform pins
          # 4.8.1; the two reinstall over each other and SCons loses its package mid-build
          # ("No module named 'SCons.Tool.FortranCommon'"). Keep the penv core on the same
          # version as the outer core installed above. Green builds without this only ride
          # on a restored cache whose penv predates 6.2.0.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build Witch(hunt) Reader Release Candidate
        env:
          CROSSPOINT_RC_VERSION: ${{ needs.prepare.outputs.rc_tag }}
        run: pio run -e ${{ matrix.env }}

      - name: Patch min_chip_rev_full to 0
        run: python3 scripts/patch_min_chip_rev.py .pio/build/${{ matrix.env }}/firmware.bin

      # Every env builds a file called firmware.bin; copy it to the board's
      # asset name. The X3/X4 leg's asset IS firmware.bin, so it needs no copy.
      - name: Name the release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/firmware.bin" \
               ".pio/build/${{ matrix.env }}/${{ matrix.asset }}"
          fi

      # The web interface is not in the firmware: build_html.py writes it as one
      # bundle, web-<hash>.bin, which the device fetches from the release or the
      # user uploads (src/network/WebAssets.h). Every leg builds the same bundle,
      # because the pages are board-independent and the bundle is
      # byte-reproducible, so the merged download holds one copy for all boards.
      - name: Check the web bundle
        run: |
          set -euo pipefail
          count=$(ls .pio/build/${{ matrix.env }}/web-*.bin 2>/dev/null | wc -l)
          if [ "$count" != "1" ]; then
            echo "::error::expected one web-*.bin in .pio/build/${{ matrix.env }}, found $count"
            exit 1
          fi

      - name: Upload ${{ matrix.asset }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.env }}/web-*.bin
          if-no-files-found: error

  publish-release-candidate:
    needs: [prepare, build-release-candidate]
    runs-on: ubuntu-latest
    env:
      RC_TAG: ${{ needs.prepare.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # merge-multiple flattens every leg's artifact into one directory, so the
      # upload below attaches all boards' binaries in a single API call.
      - name: Download board binaries
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "RELEASE_NOTES_PATH=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_ENV"
          python3 scripts/generate_release_notes.py \
            --output "${RUNNER_TEMP}/release-notes.md" \
            --target-sha "${GITHUB_SHA}" \
            --current-label "${RC_TAG}" \
            --release-scope any \
            --exclude-tag "${RC_TAG}"

      - name: Publish prerelease assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RC_TAG }}
          target_commitish: ${{ github.sha }}
          name: CrossPoint ${{ env.RC_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: true
          files: release-assets/*.bin
          fail_on_unmatched_files: true
